name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: odin build . -out:cool_platformer -target:windows_amd64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cool_platformer-windows
          path: cool_platformer.exe
